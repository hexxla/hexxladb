# Slower `//go:build integration` tests — not in default PR CI (see README).
# Weekly + manual; use `task integration` before releases.
name: Integration

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install complexity tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install github.com/uudashr/gocognit/cmd/gocognit@latest

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Install goda
        run: go install github.com/loov/goda@latest

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Run CI checks
        env:
          CI: "true"
          GOLANGCI_LINT_TIMEOUT: "5m"
        run: task ci-full

      - name: Run integration tests
        run: task integration
