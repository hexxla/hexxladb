name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned secret scanner
        run: scripts/tool.sh install-gitleaks
      - name: Scan the validated commit
        run: scripts/tool.sh gitleaks git --redact=100 --log-opts="-1 HEAD --diff-merges=first-parent"
      - name: Run required checks
        run: scripts/ci.sh
      - name: Run integration tests
        run: go test -count=1 -race -parallel=1 -timeout=30m -tags=integration -run='^TestIntegration' ./...
      - name: Run decoder fuzz smoke tests
        run: |
          go test ./internal/record -run='^$' -fuzz=FuzzDecodeCell -fuzztime=2s -parallel=2
          go test ./internal/engine -run='^$' -fuzz=FuzzDecodeHeaderPage -fuzztime=2s -parallel=2
          go test ./internal/engine -run='^$' -fuzz=FuzzParseAndReplayWAL -fuzztime=2s -parallel=2
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - name: Validate release configuration
        run: goreleaser check
      - name: Rehearse packaging
        run: goreleaser release --snapshot --clean --skip=sign
      - name: Upload rehearsal artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rehearsal
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/*SHA256SUMS
            dist/*.sbom.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release signing configuration
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Configure GPG_PRIVATE_KEY in the release environment before publishing."
            exit 1
          fi
      - name: Import release signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
