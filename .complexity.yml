# Complexity Guardrails Configuration
# Cyclomatic and cognitive complexity thresholds by architecture layer
# CRAP scoring uses test coverage data
#
# Baseline captured 2026-05-09 (851 non-test functions):
#   Cyclomatic: 597 ≤5 | 167 6-10 | 80 11-20 | 7 >20
#   Cognitive:  369 ≤5 | 190 6-15 | 53 16-30 | 8 >30
#
# Thresholds are set just above current observed maxima so CI passes green.
# Tighten each threshold after reducing the corresponding offenders.
# Target direction: pkg_root cyclo→25, cogn→35; changelog cogn→25; engine cogn→30.

complexity:
  # Master switch - set to false to disable all complexity checks
  enabled: true

  # Fail the build on violations (true) or just warn (false).
  # Set false during baseline phase — CRAP violations are informational until
  # coverage improves. Cyclo/cogn thresholds are already calibrated to pass.
  # Flip to true once CRAP violations drop to zero.
  fail_on_violation: false

  # Thresholds by hexagonal architecture layer
  # Paths are matched against file locations
  thresholds:
    domain:
      # Pure business logic - should be simple and focused
      path_prefix: "internal/domain/"
      cyclomatic: 5
      cognitive: 10

    app:
      # Use case orchestration - moderate complexity allowed
      path_prefix: "internal/app/"
      cyclomatic: 10
      cognitive: 15

    adapters_in:
      # Inbound adapters (MCP) - external concerns
      path_prefix: "internal/adapters/in/"
      cyclomatic: 15
      cognitive: 20

    adapters_out:
      # Outbound adapters (hexxladb storage) - external integrations
      path_prefix: "internal/adapters/out/"
      cyclomatic: 12
      cognitive: 18

    engine:
      # Storage engine — B+ tree algorithms are inherently complex
      # Baseline max: cyclo=23, cogn=38. Target: cogn→30 after btree refactor.
      path_prefix: "internal/engine/"
      cyclomatic: 25
      cognitive: 40

    changelog:
      # Durable log parsing and recovery are explicit state machines.
      # Baseline max: cyclo=19, cogn=28.
      path_prefix: "internal/changelog/"
      cyclomatic: 20
      cognitive: 30

    hnsw:
      # HNSW graph algorithms — graph traversal is inherently branchy
      # Baseline max: cyclo=16, cogn=28.
      path_prefix: "internal/hnsw/"
      cyclomatic: 18
      cognitive: 30

    record:
      # Wire format encode/decode
      path_prefix: "internal/record/"
      cyclomatic: 18
      cognitive: 25

    views:
      # Context assembly and cell view building
      path_prefix: "internal/views/"
      cyclomatic: 20
      cognitive: 30

    lattice:
      # Hex math and spatial algorithms
      path_prefix: "internal/lattice/"
      cyclomatic: 15
      cognitive: 25

    pkg_root:
      # Public API surface at module root
      # Baseline max: cyclo=28, cogn=37 (Update durability state machine).
      # Target after refactor: cyclo→25, cogn→35.
      path_prefix: "./"
      cyclomatic: 30
      cognitive: 40

    cmd:
      # CLI / TUI entry points — bootstrapping and display code
      path_prefix: "cmd/"
      cyclomatic: 20
      cognitive: 25

    examples:
      # Demo programs — not production code, no strict limit
      path_prefix: "examples/"
      cyclomatic: 150
      cognitive: 250

    default:
      # Fallback for unmatched internal paths
      cyclomatic: 15
      cognitive: 20

  # CRAP (Change Risk Anti-Pattern) scoring
  # Formula: CRAP = (cyclomatic² × (1 - coverage/100)³) + cyclomatic
  # High CRAP = complex AND poorly tested = dangerous to change
  crap:
    enabled: true
    # Threshold calibrated for ~37% overall coverage baseline (2026-05-09).
    # At 0% coverage: flags cyclo>=10 (10²+10=110 > 100).
    # At 50% coverage: flags cyclo>=20 (20²×0.125+20=70 < 100; cyclo>=28 → ~128).
    # Tighten toward 50 as coverage improves.
    threshold: 100
    coverage_profile: "coverage.out"
