version: "3"

vars:
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH
  BINDIR: bin/{{.GOOS}}-{{.GOARCH}}
  EXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
  DEFAULT_TMPDIR: "{{.ROOT_DIR}}/.tmp"
  TASK_TMPDIR: "{{.TMPDIR | default .DEFAULT_TMPDIR}}"

tasks:
  default:
    desc: Run the full CI pipeline
    cmds:
      - task: ci

  help:
    desc: List available tasks
    cmds:
      - task --list

  ci:
    desc: Run the shared CI validation checks
    cmds:
      - bash scripts/ci.sh

  integration:
    desc: Run optional integration tests serially with the race detector
    cmds:
      - go test -count=1 -race -parallel=1 -timeout=30m -tags=integration -run='^TestIntegration' ./...

  bench-tmp:
    desc: Create the benchmark temporary directory
    cmds:
      - mkdir -p "{{.TASK_TMPDIR}}"

  stress:
    desc: Run the optional very large stress tests
    deps: [bench-tmp]
    env:
      TMPDIR: "{{.TASK_TMPDIR}}"
    cmds:
      - go test -count=1 -race -tags=stress ./...

  bench:
    desc: Run all benchmarks across all packages
    deps: [bench-tmp]
    env:
      TMPDIR: "{{.TASK_TMPDIR}}"
    cmds:
      - go test -count=1 -bench=. -benchmem ./...

  bench-api:
    desc: Run the focused API benchmarks and save their output
    deps: [bench-tmp]
    env:
      TMPDIR: "{{.TASK_TMPDIR}}"
    cmds:
      - 'echo "==> HexxlaDB API benchmarks (Go $(go env GOVERSION), $(uname -s) $(uname -m))"'
      - 'echo "==> Output saved to .tmp/bench-api.txt"'
      - bash -o pipefail -c "go test -count=1 -bench='BenchmarkAPI_' -benchmem -benchtime=3s -v -run='^$' . 2>&1 | tee .tmp/bench-api.txt"

  bench-stress:
    desc: Run longer API benchmarks with configurable preload
    deps: [bench-tmp]
    env:
      TMPDIR: "{{.TASK_TMPDIR}}"
      HEXXLA_BENCH_PRELOAD: '{{.HEXXLA_BENCH_PRELOAD | default "all"}}'
    cmds:
      - go test -count=1 -bench='BenchmarkAPI_(GetCell|AscendCellsBySource|ScanContextRaw|ScanContextAtRaw|LoadContext|WalkRing|WalkRingAt)/' -benchmem -benchtime=500ms ./.

  evidence:
    desc: Run controlled, aggregate observation, and lattice-placement evidence
    cmds:
      - task: evidence-controlled
      - task: evidence-observe
      - task: evidence-write-path
      - task: evidence-lattice-placement

  evidence-controlled:
    desc: Run the oracle soak and focused performance benchmarks
    cmds:
      - mkdir -p .tmp/evidence .tmp/go-build
      - GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=1 -race -run='TestSuperHexSummaryIndex_RandomizedAgainstOracle$' .
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=1 -run='^$' -bench='Benchmark(FieldOfViewShadowcast|FieldOfViewRaycast)$' -benchmem -benchtime=1s ./internal/lattice 2>&1 | tee .tmp/evidence/fov-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=3 -run='^$' -bench='BenchmarkLog_ReadSinceTail$' -benchmem -benchtime=300ms ./internal/changelog 2>&1 | tee .tmp/evidence/changelog-read-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=1 -run='^$' -bench='BenchmarkAPI_(BatchPutCells|FindEdgePathDegree|LoadContextFOV|MVCCVersionResolution|SuperHexRebuild|SuperHexSummaryForCoord|SuperHexSummaries|WritePath|WriteReaderBlocking)$' -benchmem -benchtime=1s . 2>&1 | tee .tmp/evidence/api-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=5 -run='^$' -bench='^BenchmarkEncryptionPageTransform$' -benchmem -benchtime=500ms . 2>&1 | tee .tmp/evidence/encryption-page-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=5 -run='^$' -bench='^BenchmarkAuthenticatedOverflowChurn$' -benchmem -benchtime=100x ./internal/engine 2>&1 | tee .tmp/evidence/allocator-churn-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp HEXXLA_SYNC_BENCH=1 go test -count=1 -run='^$' -bench='BenchmarkEvidence_SuperHexSyncCatchUp$' -benchmem -benchtime=1x . 2>&1 | tee .tmp/evidence/superhex-sync-bench.txt"
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go test -count=3 -run='^TestStorageMaintenanceRepresentativeChurn$' -v . 2>&1 | tee .tmp/evidence/storage-churn.txt"

  evidence-observe:
    desc: Run the seeded aggregate-only evidence workload
    cmds:
      - mkdir -p .tmp/evidence .tmp/go-build
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go run ./tools/evidence/performance_evidence {{.EVIDENCE_ARGS | default ""}} | tee .tmp/evidence/workload.json"

  evidence-write-path:
    desc: Run the bounded aggregate-only write-path workload
    cmds:
      - mkdir -p .tmp/evidence
      - bash -o pipefail -c "go run ./tools/evidence/write_path_evidence {{.WRITE_EVIDENCE_ARGS | default ""}} | tee .tmp/evidence/write-path.json"

  evidence-vector-scale:
    desc: Run the bounded vector/HNSW scale, recall, reopen, and churn workload
    cmds:
      - mkdir -p .tmp/evidence .tmp/go-build
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go run ./tools/evidence/vector_scale_evidence {{.VECTOR_EVIDENCE_ARGS}} | tee {{.VECTOR_EVIDENCE_OUTPUT}}"
    vars:
      VECTOR_EVIDENCE_ARGS: '{{.VECTOR_EVIDENCE_ARGS | default ""}}'
      VECTOR_EVIDENCE_OUTPUT: '{{.VECTOR_EVIDENCE_OUTPUT | default ".tmp/evidence/vector-scale.json"}}'

  evidence-lattice-placement:
    desc: Compare deterministic clustered and interleaved lattice placement quality
    cmds:
      - mkdir -p .tmp/evidence .tmp/go-build
      - bash -o pipefail -c "GOCACHE={{.ROOT_DIR}}/.tmp/go-build TMPDIR={{.ROOT_DIR}}/.tmp go run ./tools/evidence/lattice_placement_evidence {{.PLACEMENT_EVIDENCE_ARGS}} | tee {{.PLACEMENT_EVIDENCE_OUTPUT}}"
    vars:
      PLACEMENT_EVIDENCE_ARGS: '{{.PLACEMENT_EVIDENCE_ARGS | default ""}}'
      PLACEMENT_EVIDENCE_OUTPUT: '{{.PLACEMENT_EVIDENCE_OUTPUT | default ".tmp/evidence/lattice-placement.json"}}'

  soak-pilot:
    desc: Run the conservative five-minute, minimum-sample pilot qualification
    cmds:
      - bash scripts/pilot-soak.sh {{.PILOT_SOAK_ARGS | default ""}}

  fuzz:
    desc: Run short fuzz smoke tests on internal decoders
    cmds:
      - go test ./internal/record -run='^$' -fuzz=FuzzDecodeCell -fuzztime=2s
      - go test ./internal/engine -run='^$' -fuzz=FuzzDecodeHeaderPage -fuzztime=2s
      - go test ./internal/engine -run='^$' -fuzz=FuzzParseAndReplayWAL -fuzztime=2s

  build-cli:
    desc: Build the HexxlaDB operator CLI
    cmds:
      - mkdir -p "{{.BINDIR}}"
      - GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -o "{{.BINDIR}}/hexxladb{{.EXE}}" ./cmd/hexxladb
      - 'echo "  → {{.BINDIR}}/hexxladb{{.EXE}}"'

  build-tui:
    desc: Build the HexxlaDB TUI
    cmds:
      - mkdir -p "{{.BINDIR}}"
      - GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -o "{{.BINDIR}}/hexxladb-tui{{.EXE}}" ./cmd/tui
      - 'echo "  → {{.BINDIR}}/hexxladb-tui{{.EXE}}"'

  build-examples:
    desc: Compile the three examples
    cmds:
      - go build ./examples/...

  build:
    desc: Build the CLI and TUI for the selected OS and architecture
    cmds:
      - task: build-cli
        vars: { GOOS: "{{.GOOS}}", GOARCH: "{{.GOARCH}}", BINDIR: "{{.BINDIR}}", EXE: "{{.EXE}}" }
      - task: build-tui
        vars: { GOOS: "{{.GOOS}}", GOARCH: "{{.GOARCH}}", BINDIR: "{{.BINDIR}}", EXE: "{{.EXE}}" }
      - 'echo "==> Built all targets for {{.GOOS}}/{{.GOARCH}}"'

  build-linux:
    desc: Build all targets for Linux
    cmds:
      - task: build
        vars: { GOOS: linux, GOARCH: "{{.GOARCH}}", BINDIR: '{{.BUILD_ROOT | default "bin"}}/linux-{{.GOARCH}}', EXE: "" }

  build-darwin:
    desc: Build all targets for macOS
    cmds:
      - task: build
        vars: { GOOS: darwin, GOARCH: "{{.GOARCH}}", BINDIR: '{{.BUILD_ROOT | default "bin"}}/darwin-{{.GOARCH}}', EXE: "" }

  build-windows:
    desc: Build all targets for Windows
    cmds:
      - task: build
        vars: { GOOS: windows, GOARCH: "{{.GOARCH}}", BINDIR: '{{.BUILD_ROOT | default "bin"}}/windows-{{.GOARCH}}', EXE: ".exe" }

  build-all:
    desc: Build all targets for Linux, macOS, and Windows
    cmds:
      - task: build-linux
      - task: build-darwin
      - task: build-windows
      - 'echo "==> Built all platforms into {{.BUILD_ROOT | default "bin"}}/"'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  demo:
    desc: Run the embedded quickstart in a temporary database
    cmds:
      - go run ./examples/quickstart

  demo-remote:
    desc: Run the loopback-only remote-access owner-service example
    cmds:
      - go run ./examples/remote_access

  seed:
    desc: Create a synthetic TUI fixture in a new directory
    env:
      TUI_FIXTURE_DIR: '{{.TUI_FIXTURE_DIR | default ".tmp/tui-sample"}}'
    cmds:
      - mkdir -p .tmp
      - go run ./tools/seed_tui -dir "$TUI_FIXTURE_DIR"

  tui:
    desc: Explore an existing database
    env:
      TUI_DB: '{{.TUI_DB | default ".tmp/tui-sample/fixture.db"}}'
    cmds:
      - go run ./cmd/tui -path "$TUI_DB"

  govulncheck:
    desc: Run the Go vulnerability scanner
    cmds:
      - scripts/tool.sh govulncheck ./...

  complexity:
    desc: Run cyclomatic, cognitive, and CRAP complexity checks
    cmds:
      - bash scripts/complexity.sh

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -count=1 -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files with gofmt
    cmds:
      - gofmt -w $(find . -type f -name '*.go' ! -path './vendor/*' ! -path './.git/*')

  api-check:
    desc: Verify the committed exported Go API and documentation baseline
    cmds:
      - go run ./scripts/api_surface.go

  lint:
    desc: Run golangci-lint
    cmds:
      - scripts/tool.sh golangci-lint run ./...

  mod-tidy:
    desc: Reconcile go.mod and go.sum with the module graph
    cmds:
      - go mod tidy

  mutation-test:
    desc: Run full Gremlins mutation testing; optionally set TARGET
    preconditions:
      - sh: command -v gremlins >/dev/null 2>&1
        msg: "gremlins not found; install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0"
    env:
      TARGET: '{{.TARGET | default ""}}'
    cmds:
      - 'echo "==> Running Gremlins mutation testing${TARGET:+: $TARGET}"'
      - GREMLINS_FULL=1 bash scripts/mutation-test.sh

  mutation-test-dry:
    desc: Run the fast Gremlins mutation dry-run
    preconditions:
      - sh: command -v gremlins >/dev/null 2>&1
        msg: "gremlins not found; install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0"
    cmds:
      - 'echo "==> Running Gremlins mutation testing (dry-run)..."'
      - bash scripts/mutation-test.sh
