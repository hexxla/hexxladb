# Gremlins mutation testing configuration for HexxlaDB.
# https://github.com/go-gremlins/gremlins
#
# Run only through the bounded snapshot wrapper:
#   task mutation-test (full) or task mutation-test-dry (analysis only)
# Override target: task mutation-test TARGET=./internal/lattice
# Do not invoke Gremlins directly from the repository root: it copies the whole
# module once per worker, so its temporary directory must remain outside the
# source snapshot being copied.

silent: false
unleash:
  integration: false
  dry-run: false
  tags: ""
  output: ""
  diff: ""
  output-statuses: ""
  # 32 cores but only ~4GB available RAM; each worker spawns a full go test
  # compile+run (~300-500MB). 4 workers × 2 CPUs = 8 cores, safe ceiling.
  workers: 4
  test-cpu: 2
  # The default coefficient (5) is far too low for packages whose tests take >10ms.
  # 100 gives reliable results: a 50ms baseline becomes 5s timeout per mutant.
  timeout-coefficient: 100
  threshold:
    # NOTE: gremlins dev build does not exit non-zero on threshold violations
    # (errors.As unwrap through cobra fails). Thresholds here are documentation
    # only. Enforcement is done in 06-gremlins.sh by parsing stdout.
    #
    # Baseline 2026-05-09 (full run, workers=4):
    #   lattice:   efficacy=100% mcover=88%
    #   record:    efficacy=100% mcover=93%
    #   changelog: efficacy=100% mcover=97%
    #   hnsw:      efficacy=100% mcover=91%
    #   index:     efficacy=100% mcover=55% (key encode funcs not directly tested)
    efficacy: 0
    mutant-coverage: 0
  exclude-files:
    - ".*_test\\.go"
    - "doc\\.go"
    - ".*_example_test\\.go"

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: false
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-negatives:
    enabled: true
  invert-logical:
    enabled: false
  invert-loopctrl:
    enabled: false
  remove-self-assignments:
    enabled: false
